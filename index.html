<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Firdaus</title>
    <!-- Font Awesome untuk Ikon Media Sosial & Tech -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }

        /* --- ANIMASI & UI --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .marquee-top { position: fixed; top: 0; left: 0; width: 100%; background-color: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 8px 0; font-size: 0.8rem; z-index: 1500; overflow: hidden; border-bottom: 1px solid #38bdf8; }
        .marquee-content { display: inline-block; white-space: nowrap; padding-left: 100%; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* --- KOMPONEN HOME --- */
        .page-section { min-height: 100vh; display: none; padding: 120px 20px 40px 20px; max-width: 800px; margin: 0 auto; text-align: center; }
        .active-section { display: block; animation: fadeIn 0.8s ease-out forwards; }
        .animate-item { opacity: 0; animation: fadeIn 0.8s ease-out forwards; }
        .delay-1 { animation-delay: 0.2s; } .delay-2 { animation-delay: 0.4s; } .delay-3 { animation-delay: 0.6s; }

        .profile-img { width: 170px; height: 170px; border-radius: 50%; border: 4px solid #38bdf8; object-fit: cover; margin-bottom: 20px; }
        .btn-lihat-profil { background-color: #38bdf8; color: #0f172a; padding: 12px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin-bottom: 30px; }

        /* --- SOSIAL MEDIA & TECH GRID --- */
        .section-title { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; margin-top: 10px; }
        .social-container, .tech-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .tech-container { grid-template-columns: repeat(5, 1fr); gap: 10px; }
        
        .box { background-color: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: #f8fafc; transition: 0.3s; }
        .box:hover { color: #38bdf8; border-color: #38bdf8; transform: translateY(-5px); }

        /* Sidebar & MenuIcon tetap sama */
        .menu-icon { position: fixed; top: 45px; left: 20px; z-index: 1000; cursor: pointer; color: #38bdf8; background: #1e293b; padding: 10px 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .sidebar { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background-color: #1e293b; padding: 100px 20px; transition: 0.4s; z-index: 999; }
        .sidebar.active { left: 0; }
        .sidebar a { display: block; color: #f8fafc; padding: 15px 0; font-size: 1.2rem; cursor: pointer; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="marquee-top"><div class="marquee-content">⚠ WEB INI SEDANG DALAM PERKEMBANGAN DAN HANYA TRAINING • WEB INI SEDANG DALAM PERKEMBANGAN DAN HANYA TRAINING •</div></div>

    <div class="menu-icon" onclick="toggleSidebar()">⋮</div>
    <div class="sidebar" id="sidebar">
        <a onclick="showSection('home')">Home</a>
        <a onclick="showSection('cv')">CV</a>
        <a onclick="showSection('gallery')">Gallery</a>
    </div>

    <!-- HOME -->
    <section class="page-section active-section" id="home">
        <img src="Firdas.png" class="profile-img animate-item">
        <h1 class="animate-item delay-1">Mohamad Firdaus</h1>
        <p class="animate-item delay-2" style="color: #94a3b8; margin-bottom: 20px;">Digital Creator & AI Developer</p>
        <button class="btn-lihat-profil animate-item delay-2" onclick="showSection('cv')">Lihat Profil</button>

        <!-- SOSIAL MEDIA -->
        <h3 class="section-title animate-item delay-3">Sosial Media</h3>
        <div class="social-container animate-item delay-3">
            <a href="https://www.instagram.com/firdaus_jv?igsh=MWlkOHp2NHdodmFvbQ==" class="box"><i class="fab fa-instagram"></i></a>
            <a href="https://x.com/firdsss98" class="box"><i class="fab fa-x-twitter"></i></a>
            <a href="https://www.linkedin.com/in/mohamad-firdaus-052b451ba?utm_source=share_via&utm_content=profile&utm_medium=member_android" class="box"><i class="fab fa-linkedin-in"></i></a>
        </div>

        <!-- TECH STACK -->
        <h3 class="section-title animate-item delay-3">Tech Stack</h3>
        <div class="tech-container animate-item delay-3">
            <div class="box"><i class="fab fa-python"></i></div>
            <div class="box"><i class="fab fa-html5"></i></div>
            <div class="box"><i class="fab fa-css3-alt"></i></div>
            <div class="box"><i class="fab fa-js"></i></div>
            <div class="box"><i class="fab fa-github"></i></div>
            <div class="box"><i class="fab fa-node-js"></i></div>
            <div class="box"><i class="fab fa-react"></i></div>
            <div class="box"><i class="fab fa-android"></i></div>
            <div class="box"><i class="fas fa-terminal"></i></div>
            <div class="box"><i class="fab fa-sass"></i></div>
        </div>
    </section>

    <!-- Script tetap sama -->
    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showSection(id) {
            document.querySelectorAll('.page-section').forEach(sec => sec.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.getElementById('sidebar').classList.remove('active');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
