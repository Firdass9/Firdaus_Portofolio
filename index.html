<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Firdaus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }

        /* --- HAMBURGER ICON (TITIK TIGA) --- */
        .menu-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            cursor: pointer;
            font-size: 24px;
            color: #38bdf8;
            background: #1e293b;
            padding: 5px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- SIDEBAR MENU --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: #1e293b;
            padding: 80px 20px;
            transition: 0.4s;
            z-index: 999;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar.active { left: 0; }
        .sidebar a {
            display: block;
            color: #f8fafc;
            text-decoration: none;
            padding: 15px 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #334155;
            cursor: pointer;
        }

        .sidebar a:hover { color: #38bdf8; }

        /* --- PAGE SECTIONS --- */
        .page-section { min-height: 100vh; display: none; padding: 100px 20px; max-width: 900px; margin: 0 auto; opacity: 0; transition: 0.5s; }
        .active-section { display: block; opacity: 1; }

        /* Styles lainnya tetap sama agar konsisten */
        .profile-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 4px solid #38bdf8; margin-bottom: 20px; }
        #home { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .btn-primary { background-color: #38bdf8; color: #0f172a; padding: 10px 25px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .gallery-item { background: #1e293b; border-radius: 10px; overflow: hidden; }
        .gallery-item img { width: 100%; height: 150px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- Tombol Titik Tiga -->
    <div class="menu-icon" onclick="toggleSidebar()">⋮</div>

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <a onclick="showSection('home')">Home</a>
        <a onclick="showSection('cv')">CV</a>
        <a onclick="showSection('gallery')">Gallery</a>
    </div>

    <!-- Home Section -->
    <section class="page-section active-section" id="home">
        <img src="Firdas.png" alt="Profil" class="profile-img">
        <h1>Halo, Saya Firdaus</h1>
        <p>Digital Creator & Developer</p>
        <button class="btn-primary" onclick="showSection('cv')">Lihat Profil</button>
    </section>

    <!-- CV Section -->
    <section class="page-section" id="cv">
        <h2>CV & Pengalaman</h2>
        <p style="margin-top: 20px;">Detail pengalaman kerja dan skill kamu di sini...</p>
    </section>

    <!-- Gallery Section -->
    <section class="page-section" id="gallery">
        <h2>Gallery Karya</h2>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="Firdas.png"></div>
            <div class="gallery-item"><img src="Firdas.png"></div>
        </div>
    </section>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function showSection(id) {
            // Sembunyikan semua section
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active-section'));
            // Tampilkan section yang dipilih
            document.getElementById(id).classList.add('active-section');
            // Tutup sidebar
            document.getElementById('sidebar').classList.remove('active');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
